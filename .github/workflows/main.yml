name: main

on:
  push:
    branches: [main, test-me-*]
    tags: ['*']
  pull_request:

jobs:
  main-windows:
    uses: asottile/workflows/.github/workflows/tox.yml@a6a709a215b6035716f756bd2eb72799fda38adc # v1.10.0
    with:
      env: '["py39"]'
      os: windows-latest
      wheel-tags: true
  main-macos:
    uses: asottile/workflows/.github/workflows/tox.yml@a6a709a215b6035716f756bd2eb72799fda38adc # v1.10.0
    with:
      env: '["py39"]'
      os: macos-latest
      wheel-tags: true
  main-macos-intel:
    uses: asottile/workflows/.github/workflows/tox.yml@a6a709a215b6035716f756bd2eb72799fda38adc # v1.10.0
    with:
      env: '["py39"]'
      os: macos-13
      wheel-tags: true
  main-linux:
    uses: asottile/workflows/.github/workflows/tox.yml@a6a709a215b6035716f756bd2eb72799fda38adc # v1.10.0
    with:
      env: '["py39"]'
      os: ubuntu-latest
